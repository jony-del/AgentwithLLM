name: Release wheel installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SANDBOX_IMAGE: ghcr.io/jony-del/agentwithllm-sandbox

jobs:
  sandbox-lock:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.verify.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: verify
        name: Verify the locked multi-architecture image is publicly downloadable
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, urllib.request
          lock = json.loads(pathlib.Path("agent_core/sandbox/sandbox-image.lock.json").read_text())
          manifest = json.loads(pathlib.Path("installer/manifest.json").read_text())
          image = lock["image"]
          match = re.fullmatch(r"ghcr.io/jony-del/agentwithllm-sandbox@(sha256:[0-9a-f]{64})", image)
          if not match or manifest["sandbox_image"] != image:
              raise SystemExit("sandbox locks must match and use an immutable digest")
          digest = match.group(1)
          with urllib.request.urlopen("https://ghcr.io/token?service=ghcr.io&scope=repository:jony-del/agentwithllm-sandbox:pull", timeout=30) as response:
              token = json.load(response)["token"]
          request = urllib.request.Request(
              f"https://ghcr.io/v2/jony-del/agentwithllm-sandbox/manifests/{digest}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read()
          if "sha256:" + hashlib.sha256(body).hexdigest() != digest:
              raise SystemExit("registry index does not match the locked digest")
          platforms = {f"{item['platform']['os']}/{item['platform']['architecture']}" for item in json.loads(body)["manifests"]}
          if not set(lock["platforms"]).issubset(platforms):
              raise SystemExit("registry index is missing a required platform")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"digest={digest}\n")
          print(f"Verified public sandbox index: {image}")
          PY

  linux-oci-e2e:
    needs: sandbox-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra all --extra dev --python 3.12
      - name: Linux real OCI sandbox E2E
        env:
          POLARIS_SANDBOX_E2E_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ needs.sandbox-lock.outputs.digest }}
          POLARIS_SANDBOX_E2E_RUNTIME: docker
        run: uv run --no-sync python -m pytest -q tests/test_sandbox_oci_e2e.py

  build-release:
    needs: sandbox-lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and immutable sandbox locks
        env:
          DIGEST: ${{ needs.sandbox-lock.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("release tag must match project version")
          digest = os.environ["DIGEST"]
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("invalid OCI index digest")
          image = f"ghcr.io/jony-del/agentwithllm-sandbox@{digest}"
          for name, key in [("agent_core/sandbox/sandbox-image.lock.json", "image"), ("installer/manifest.json", "sandbox_image")]:
              path = pathlib.Path(name)
              content = json.loads(path.read_text())
              if content[key] != image:
                  raise SystemExit(f"sandbox lock mismatch: {name}")
          PY
      - name: Distribution and installer regression tests
        run: |
          uv sync --locked --extra all --extra dev --python 3.12
          uv run --no-sync python -m pytest -q tests/test_release_distribution.py tests/test_installer.py tests/test_uninstall.py tests/test_cli.py
          bash -n install.sh
      - name: Build wheel, locked constraints and minimal installer bundles
        run: python tools/build_release_assets.py --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  cli-install:
    needs: build-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # No checkout: installed commands must work without the repository.
    # No actions/setup-python either: this lane must prove the install works on
    # a machine with no system Python at all. Every interpreter below is
    # provisioned and selected by uv (UV_PYTHON_PREFERENCE=only-managed makes uv
    # refuse host interpreters), and the steps assert that fact instead of
    # assuming it.
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - name: Provision a uv-managed Python 3.12 with no system Python involved
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          set -euo pipefail
          uv python install 3.12
          MANAGED_ROOT="$(uv python dir)"
          FOUND="$(uv python find --no-project 3.12)"
          echo "uv-managed Python root: $MANAGED_ROOT"
          echo "Selected interpreter: $FOUND"
          POLARIS_UV_PYTHON_DIR="$MANAGED_ROOT" "$FOUND" - <<'PY'
          import os, sys
          managed = os.path.normcase(os.path.realpath(os.environ["POLARIS_UV_PYTHON_DIR"]))
          executable = os.path.normcase(os.path.realpath(sys.executable))
          assert sys.version_info[:2] == (3, 12), sys.version
          assert executable.startswith(managed + os.sep), (executable, managed)
          assert "hostedtoolcache" not in executable, executable
          print(f"Confirmed uv-managed interpreter: {executable}")
          PY
          echo "POLARIS_MANAGED_PYTHON=$FOUND" >> "$GITHUB_ENV"
          echo "POLARIS_UV_PYTHON_DIR=$MANAGED_ROOT" >> "$GITHUB_ENV"
      - name: Install and exercise the distributed wheel outside any checkout
        shell: bash
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          set -euo pipefail
          "$POLARIS_MANAGED_PYTHON" - <<'PY'
          import json, os, pathlib, subprocess, tempfile
          root = pathlib.Path("release").resolve()
          release = json.loads((root / "release.json").read_text())
          wheel = root / release["wheel"]["filename"]
          subprocess.run(["uv", "tool", "install", "--python", "3.12", "--constraints", str(root / "polaris-constraints.txt"), f"{wheel}[all]"], check=True)
          tool_root = pathlib.Path(subprocess.check_output(["uv", "tool", "dir"], text=True).strip())
          bin_dir = pathlib.Path(subprocess.check_output(["uv", "tool", "dir", "--bin"], text=True).strip())
          # The installed tool environment must run on the uv-managed
          # interpreter, never on a system or hosted-toolcache Python.
          venv_python = tool_root / "agent-with-llm" / ("Scripts/python.exe" if os.name == "nt" else "bin/python")
          base = subprocess.check_output([str(venv_python), "-c", "import sys; print(sys.base_prefix)"], text=True).strip()
          managed_root = os.path.normcase(os.path.realpath(os.environ["POLARIS_UV_PYTHON_DIR"]))
          assert os.path.normcase(os.path.realpath(base)).startswith(managed_root + os.sep), (base, managed_root)
          cli = bin_dir / ("polaris.exe" if os.name == "nt" else "polaris")
          with tempfile.TemporaryDirectory() as directory:
              work = pathlib.Path(directory) / "work"
              work.mkdir()
              env = dict(os.environ, POLARIS_HOME=str(pathlib.Path(directory) / "home"))
              output = subprocess.check_output([str(cli), "--version"], cwd=work, env=env, text=True).strip()
              assert output == f"polaris {release['version']}", output
              subprocess.run([str(cli), "run", "Say hello without tools", "--provider", "fake", "--no-memory", "--session-dir", ""], cwd=work, env=env, check=True)
              result = subprocess.run([str(cli), "health", "--provider", "fake", "--no-memory", "--json"], cwd=work, env=env, capture_output=True, text=True)
              checks = {item["name"]: item for item in json.loads(result.stdout)["checks"]}
              for name in ("configuration", "provider"):
                  assert checks[name]["status"] == "ok", checks[name]
          PY
      - name: Validate distributed PowerShell entrypoint
        if: runner.os == 'Windows'
        shell: pwsh
        run: Get-Command ./release/install.ps1 | Out-Null
      - name: Validate distributed Bash entrypoint
        if: runner.os != 'Windows'
        run: bash -n release/install.sh

  release:
    needs: [build-release, cli-install, linux-oci-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish verified GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag --draft
          gh release upload "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
