name: Release installer assets

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  SANDBOX_IMAGE: ghcr.io/jony-del/agentwithllm-sandbox

jobs:
  sandbox-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.SANDBOX_IMAGE }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Verify OCI index digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'

  linux-oci-e2e:
    needs: sandbox-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[all,dev]
      - name: Linux real OCI sandbox E2E
        env:
          POLARIS_SANDBOX_E2E_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ needs.sandbox-image.outputs.digest }}
          POLARIS_SANDBOX_E2E_RUNTIME: docker
        run: python -m pytest -q tests/test_sandbox_oci_e2e.py

  windows-wsl2-e2e:
    needs: sandbox-image
    runs-on: [self-hosted, Windows, X64, polaris-wsl2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[all,dev]
      - name: Start installer-owned Podman Machine for release verification
        shell: pwsh
        run: podman machine start
      - name: Windows WSL2 Podman E2E
        shell: pwsh
        env:
          POLARIS_SANDBOX_E2E_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ needs.sandbox-image.outputs.digest }}
          POLARIS_SANDBOX_E2E_RUNTIME: podman
        run: python -m pytest -q tests/test_sandbox_oci_e2e.py
      - name: Stopped Podman Machine must fail closed
        shell: pwsh
        env:
          POLARIS_SANDBOX_E2E_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ needs.sandbox-image.outputs.digest }}
          POLARIS_SANDBOX_E2E_RUNTIME: podman
          POLARIS_SANDBOX_E2E_EXPECT_STOPPED: "1"
        run: |
          podman machine stop
          python -m pytest -q tests/test_sandbox_oci_e2e.py::test_stopped_runtime_fails_closed_without_host_execution
      - name: Restore Podman Machine for the runner
        if: always()
        shell: pwsh
        run: podman machine start

  release:
    needs: [sandbox-image, linux-oci-e2e, windows-wsl2-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate tag and inject immutable sandbox digest
        shell: bash
        env:
          DIGEST: ${{ needs.sandbox-image.outputs.digest }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match project version v{version}")
          image = f"ghcr.io/jony-del/agentwithllm-sandbox@{os.environ['DIGEST']}"
          lock_path = pathlib.Path("agent_core/sandbox/sandbox-image.lock.json")
          lock = json.loads(lock_path.read_text())
          lock["image"] = image
          lock_path.write_text(json.dumps(lock, indent=2) + "\n")
          manifest_path = pathlib.Path("installer/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          manifest["sandbox_image"] = image
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          bash -n install.sh
          python installer/install.py --help
          python agent_core/uninstall.py --help
      - name: Build reproducible source assets
        shell: bash
        run: |
          python tools/build_release_archives.py
          sha256sum polaris-source.zip polaris-source.tar.gz install.ps1 install.sh > SHA256SUMS
      - name: Smoke-test release archives
        shell: bash
        run: |
          mkdir smoke-zip smoke-tar
          unzip -q polaris-source.zip -d smoke-zip
          tar -xzf polaris-source.tar.gz -C smoke-tar
          python smoke-zip/installer/install.py --help
          python smoke-tar/installer/install.py --help
          python smoke-zip/agent_core/uninstall.py --help
          python smoke-tar/agent_core/uninstall.py --help
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" \
            polaris-source.zip polaris-source.tar.gz SHA256SUMS install.ps1 install.sh --clobber
