name: Build and qualify sandbox image

# Sandbox images have an independent lifecycle. Update both image locks after
# qualification; a CLI release then verifies and tests that exact public digest.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "New image tag (for example sandbox-20261006)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  SANDBOX_IMAGE: ghcr.io/jony-del/agentwithllm-sandbox

jobs:
  sandbox-image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          python - <<'PY'
          import os, re
          if not re.fullmatch(r"[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}", os.environ["IMAGE_TAG"]):
              raise SystemExit("invalid image tag")
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.SANDBOX_IMAGE }}:${{ inputs.image_tag }}
          sbom: true
          provenance: mode=max
      - name: Record immutable image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Built $SANDBOX_IMAGE@$DIGEST from $GITHUB_SHA; qualification follows." >> "$GITHUB_STEP_SUMMARY"

  linux-oci-e2e:
    needs: sandbox-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra all --extra dev --python 3.12
      - name: Linux real OCI sandbox E2E
        env:
          POLARIS_SANDBOX_E2E_IMAGE: ${{ env.SANDBOX_IMAGE }}@${{ needs.sandbox-image.outputs.digest }}
          POLARIS_SANDBOX_E2E_RUNTIME: docker
        run: uv run --no-sync python -m pytest -q tests/test_sandbox_oci_e2e.py
